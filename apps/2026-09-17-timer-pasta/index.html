<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b8860f">
  <title>Timer Pasta — cottura al minuto</title>
  <meta name="description" content="Tempi di cottura dei formati di pasta più comuni, timer a tutto schermo con avviso sonoro e dosi di acqua e sale.">
  <style>
    :root {
      --bg: #fdf8ec;
      --bg-2: #f6eed9;
      --surface: #fffdf7;
      --text: #24200f;
      --muted: #7a7053;
      --line: #e6dcc0;
      --accent: #b8860f;
      --accent-soft: #f2e2b4;
      --accent-ink: #fffdf7;
      --danger: #a53a22;
      --ok: #4c7a34;
      --r-lg: 28px;
      --r-md: 20px;
      --r-sm: 14px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16140d;
        --bg-2: #1f1c12;
        --surface: #221f14;
        --text: #f3ecd9;
        --muted: #a79a76;
        --line: #37311f;
        --accent: #e7b73c;
        --accent-soft: #3b3117;
        --accent-ink: #201a06;
        --danger: #f08a6c;
        --ok: #9ac476;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 17px/1.45 "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, system-ui, sans-serif;
      background: radial-gradient(120% 60% at 50% 0%, var(--bg-2), var(--bg) 70%);
      background-attachment: fixed;
      color: var(--text);
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    .app {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) 16px 0;
      max-width: 760px;
      margin: 0 auto;
    }

    /* ---- barra in alto ---- */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
    .back {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 10px 0 2px;
      color: var(--muted); text-decoration: none; font-size: .95rem; border-radius: var(--r-sm);
    }
    .back:focus-visible, .btn:focus-visible, .chip:focus-visible, .voce:focus-visible,
    .ring-btn:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .marchio { font-weight: 700; letter-spacing: -.01em; font-size: 1rem; }
    .marchio span { color: var(--accent); }

    /* ---- selettore formato ---- */
    .scelta { text-align: center; margin: 10px 0 2px; }
    .btn-formato {
      display: inline-flex; align-items: center; gap: 10px; max-width: 100%;
      min-height: 52px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--surface); color: var(--text); font: inherit; font-weight: 700; font-size: 1.15rem;
      cursor: pointer; box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }
    .btn-formato .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-formato .freccia { color: var(--muted); font-size: .8rem; flex: none; }
    .sotto { margin: 8px 0 0; color: var(--muted); font-size: .95rem; }

    /* ---- cotture ---- */
    .cotture {
      display: grid; grid-template-columns: 1.18fr 1fr 1fr; gap: 8px;
      max-width: 430px; margin: 12px auto 2px; padding: 6px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    }
    .chip {
      min-height: 44px; padding: 6px 6px; border: 0; border-radius: 999px; line-height: 1.15;
      background: transparent; color: var(--muted); font: inherit; font-size: .92rem; letter-spacing: -.01em; cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 700; }

    /* ---- timer centrale ---- */
    .centro { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 6px 0 2px; }
    .ring-btn {
      position: relative; width: min(72vw, 40dvh, 300px); aspect-ratio: 1; padding: 0;
      border: 0; background: none; cursor: pointer; border-radius: 50%; color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .ring-btn svg { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }
    .traccia { fill: none; stroke: var(--line); stroke-width: 14; }
    .avanzamento { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
    .dentro {
      position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .tempo.glifo { font-size: clamp(2.6rem, 14vw, 3.6rem); }
    .tempo { font-size: clamp(3rem, 17vw, 4.4rem); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1; }
    .stato { font-size: .95rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
    .app[data-fase="done"] .avanzamento { stroke: var(--ok); }
    .app[data-fase="done"] .tempo { color: var(--ok); }
    .app[data-fase="done"] .ring-btn { animation: pulsa 1.1s ease-in-out infinite; }
    .app[data-fase="paused"] .tempo { opacity: .55; }
    @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) {
      .app[data-fase="done"] .ring-btn { animation: none; }
      .avanzamento { transition: none; }
    }

    /* ---- regolazioni ---- */
    .regola { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-tondo {
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
      color: var(--text); font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .btn-tondo:disabled { opacity: .4; cursor: default; }

    /* ---- dosi ---- */
    .dosi {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px;
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
      padding: 8px 12px; margin: 2px 0 0; font-size: .97rem;
    }
    .dosi .gruppo { display: flex; align-items: center; gap: 8px; }
    .dosi .btn-tondo { width: 44px; height: 44px; font-size: 1.05rem; }
    .dosi .valore { min-width: 4.2em; text-align: center; font-variant-numeric: tabular-nums; }
    .dosi .calcolo { color: var(--muted); text-align: center; }
    .dosi .calcolo b { color: var(--text); font-weight: 700; }

    /* ---- barra azioni ---- */
    .azioni {
      position: sticky; bottom: 0; display: flex; gap: 10px;
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 62%, rgba(0,0,0,0));
    }
    .btn {
      flex: 1 1 auto; min-height: 56px; padding: 10px 18px; border: 0; border-radius: var(--r-lg);
      background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 1.12rem; font-weight: 700; cursor: pointer;
    }
    .btn.ghost { flex: 0 1 34%; background: var(--surface); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
    .btn:disabled { opacity: .45; cursor: default; }
    .suggerimento { display: none; text-align: center; color: var(--muted); font-size: .9rem; padding-bottom: 10px; }

    /* ---- pannello formati (sale dal basso) ---- */
    .velo {
      position: fixed; inset: 0; background: rgba(20,16,4,.45); border: 0; padding: 0; margin: 0; width: 100%;
      opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 5;
    }
    .pannello {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
      max-height: 86dvh; display: flex; flex-direction: column;
      background: var(--surface); border-top: 1px solid var(--line);
      border-radius: var(--r-lg) var(--r-lg) 0 0;
      transform: translateY(102%); transition: transform .25s ease; visibility: hidden;
    }
    body.aperto .velo { opacity: 1; pointer-events: auto; }
    body.aperto .pannello { transform: none; visibility: visible; }
    body.aperto { overflow: hidden; }
    @media (prefers-reduced-motion: reduce) { .pannello, .velo { transition: none; } }
    .maniglia { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 10px auto 4px; flex: none; }
    .pannello header { display: flex; align-items: center; gap: 10px; padding: 4px 14px 10px; flex: none; }
    .pannello h2 { margin: 0; font-size: 1.12rem; flex: 1 1 auto; }
    .cerca {
      margin: 0 14px 10px; flex: none; width: calc(100% - 28px);
      min-height: 48px; padding: 10px 14px; font: inherit; font-size: 16px;
      border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); color: var(--text);
    }
    .elenco { list-style: none; margin: 0; padding: 0 10px calc(14px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .voce {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
      min-height: 56px; padding: 10px 12px; margin-bottom: 4px;
      background: none; border: 0; border-radius: var(--r-sm); color: inherit; font: inherit; text-align: left; cursor: pointer;
    }
    .voce:hover { background: var(--bg-2); }
    .voce[aria-current="true"] { background: var(--accent-soft); font-weight: 700; }
    .voce .min { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
    .voce[aria-current="true"] .min { color: var(--text); }
    .vuoto { padding: 18px 14px 26px; color: var(--muted); text-align: center; }
    .chiudi {
      min-width: 44px; min-height: 44px; border: 0; border-radius: 50%; background: var(--bg-2);
      color: var(--text); font: inherit; font-size: 1.05rem; cursor: pointer; flex: none;
    }

    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---- desktop: miglioramento progressivo ---- */
    @media (min-width: 700px) {
      .app { padding-left: 24px; padding-right: 24px; }
      .ring-btn { width: min(340px, 44dvh); }
      .centro { gap: 18px; }
      .azioni { position: static; background: none; padding-bottom: 8px; }
      .suggerimento { display: block; }
      .pannello { left: 50%; right: auto; bottom: 24px; width: 520px; transform: translate(-50%, 110%); border-radius: var(--r-lg); border: 1px solid var(--line); }
      body.aperto .pannello { transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="app" id="app" data-fase="idle">
    <div class="topbar">
      <a class="back" href="../../index.html">← Tutte le app</a>
      <div class="marchio">Timer <span>Pasta</span></div>
    </div>

    <div class="scelta">
      <button class="btn-formato" id="btnFormato" aria-haspopup="dialog">
        <span class="nome" id="nomeFormato">Scegli il formato</span>
        <span class="freccia" aria-hidden="true">▼</span>
      </button>
      <p class="sotto" id="sottotitolo">Tocca per scegliere il formato</p>
    </div>

    <div class="cotture" role="group" aria-label="Grado di cottura">
      <button class="chip" type="button" data-cottura="molto" aria-pressed="false">Molto al dente</button>
      <button class="chip" type="button" data-cottura="dente" aria-pressed="true">Al dente</button>
      <button class="chip" type="button" data-cottura="cotta" aria-pressed="false">Ben cotta</button>
    </div>

    <main class="centro">
      <button class="ring-btn" id="ring">
        <svg viewBox="0 0 240 240" aria-hidden="true" focusable="false">
          <circle class="traccia" cx="120" cy="120" r="106"></circle>
          <circle class="avanzamento" id="arco" cx="120" cy="120" r="106" stroke-dasharray="666" stroke-dashoffset="0"></circle>
        </svg>
        <span class="dentro">
          <span class="tempo glifo" id="tempo">🍝</span>
          <span class="stato" id="etichettaStato">pronto</span>
        </span>
      </button>

      <div class="regola">
        <button class="btn-tondo" type="button" id="meno" aria-label="Togli 30 secondi">−30s</button>
        <button class="btn-tondo" type="button" id="piu" aria-label="Aggiungi 30 secondi">+30s</button>
      </div>

      <div class="dosi">
        <div class="gruppo">
          <button class="btn-tondo" type="button" id="menoPersone" aria-label="Una persona in meno">−</button>
          <span class="valore" id="numPersone" aria-live="off">2 pers.</span>
          <button class="btn-tondo" type="button" id="piuPersone" aria-label="Una persona in più">+</button>
        </div>
        <p class="calcolo" id="calcolo"></p>
      </div>
    </main>

    <div class="azioni">
      <button class="btn ghost" type="button" id="btnAzzera" disabled>Azzera</button>
      <button class="btn" type="button" id="btnAvvia">Avvia</button>
    </div>
    <p class="suggerimento">Barra spaziatrice: avvia o metti in pausa · Esc: chiudi o azzera</p>
  </div>

  <button class="velo" id="velo" tabindex="-1" aria-label="Chiudi l'elenco dei formati"></button>
  <section class="pannello" id="pannello" role="dialog" aria-modal="true" aria-labelledby="titoloPannello" aria-hidden="true">
    <div class="maniglia" aria-hidden="true"></div>
    <header>
      <h2 id="titoloPannello">Formato di pasta</h2>
      <button class="chiudi" type="button" id="btnChiudi" aria-label="Chiudi">✕</button>
    </header>
    <input class="cerca" id="cerca" type="text" placeholder="Cerca un formato…" autocomplete="off" enterkeyhint="search" aria-label="Cerca un formato">
    <ul class="elenco" id="elenco"></ul>
    <p class="vuoto" id="nessuno" hidden>Nessun formato con questo nome. I tempi sono indicativi: controlla sempre la confezione.</p>
  </section>

  <p class="sr" id="annuncio" role="status" aria-live="polite"></p>

  <script>
    // Modello dati: ogni formato ha un tempo base in secondi (cottura "al dente"); il grado di
    // cottura applica uno scarto (−60s / 0 / +90s) e i tasti ±30s un aggiustamento manuale.
    // Il timer vive in `stato` e si salva in localStorage con la scadenza assoluta (ms epoch),
    // così ricaricando la pagina il conto alla rovescia riprende esatto.

    const CHIAVE = "timer-pasta:v1";
    const FORMATI = [
      { id: "spaghetti", nome: "Spaghetti", sec: 480 },
      { id: "spaghettini", nome: "Spaghettini", sec: 360 },
      { id: "vermicelli", nome: "Vermicelli", sec: 540 },
      { id: "capellini", nome: "Capellini", sec: 180 },
      { id: "linguine", nome: "Linguine", sec: 540 },
      { id: "bucatini", nome: "Bucatini", sec: 540 },
      { id: "penne-rigate", nome: "Penne rigate", sec: 660 },
      { id: "pennette", nome: "Pennette", sec: 480 },
      { id: "rigatoni", nome: "Rigatoni", sec: 720 },
      { id: "mezze-maniche", nome: "Mezze maniche", sec: 600 },
      { id: "paccheri", nome: "Paccheri", sec: 780 },
      { id: "fusilli", nome: "Fusilli", sec: 660 },
      { id: "farfalle", nome: "Farfalle", sec: 660 },
      { id: "conchiglie", nome: "Conchiglie", sec: 660 },
      { id: "orecchiette", nome: "Orecchiette secche", sec: 720 },
      { id: "sedanini", nome: "Sedanini", sec: 540 },
      { id: "maccheroni", nome: "Maccheroni", sec: 600 },
      { id: "ditalini", nome: "Ditalini", sec: 480 },
      { id: "stelline", nome: "Stelline (in brodo)", sec: 300 },
      { id: "tagliatelle", nome: "Tagliatelle secche", sec: 360 },
      { id: "tagliatelle-fresche", nome: "Tagliatelle fresche", sec: 180 },
      { id: "tortellini", nome: "Tortellini freschi", sec: 240 },
      { id: "ravioli", nome: "Ravioli freschi", sec: 300 },
      { id: "gnocchi", nome: "Gnocchi di patate", sec: 120 },
    ];
    const SCARTI = { molto: -60, dente: 0, cotta: 90 };
    const ETICHETTE = { molto: "molto al dente", dente: "al dente", cotta: "ben cotta" };
    const MIN_SEC = 30, MAX_SEC = 60 * 60;
    const CIRCONFERENZA = 2 * Math.PI * 106;

    const el = (id) => document.getElementById(id);
    const app = el("app"), ring = el("ring"), arco = el("arco"), tempoEl = el("tempo"), statoEl = el("etichettaStato");
    const btnAvvia = el("btnAvvia"), btnAzzera = el("btnAzzera"), btnFormato = el("btnFormato");
    const nomeFormato = el("nomeFormato"), sottotitolo = el("sottotitolo"), calcolo = el("calcolo");
    const numPersone = el("numPersone"), elenco = el("elenco"), cerca = el("cerca");
    const pannello = el("pannello"), velo = el("velo"), nessuno = el("nessuno"), annuncio = el("annuncio");

    let stato = {
      formato: null,      // id del formato scelto
      cottura: "dente",
      persone: 2,
      manuale: 0,         // secondi aggiunti/tolti a mano
      fase: "idle",       // idle | running | paused | done
      scadenza: 0,        // ms epoch di fine (fase running)
      rimasti: 0,         // ms residui (fase paused/idle)
      durata: 0,          // ms totali del conteggio in corso
    };
    let tick = null, audio = null, sveglia = null, schermo = null;
    const titoloBase = document.title;

    /* ---------- persistenza ---------- */
    function salva() {
      try { localStorage.setItem(CHIAVE, JSON.stringify(stato)); } catch (e) { /* spazio pieno o privato */ }
    }
    function carica() {
      let dati = null;
      try { dati = JSON.parse(localStorage.getItem(CHIAVE) || "null"); } catch (e) { dati = null; }
      if (!dati || typeof dati !== "object") return;
      const valido = FORMATI.some(f => f.id === dati.formato);
      stato.formato = valido ? dati.formato : null;
      if (SCARTI[dati.cottura] !== undefined) stato.cottura = dati.cottura;
      if (Number.isFinite(dati.persone)) stato.persone = Math.min(12, Math.max(1, Math.round(dati.persone)));
      if (Number.isFinite(dati.manuale)) stato.manuale = Math.max(-MAX_SEC, Math.min(MAX_SEC, Math.round(dati.manuale)));
      if (!valido) return;
      if (dati.fase === "running" && Number.isFinite(dati.scadenza)) {
        stato.durata = Number(dati.durata) || 0;
        if (dati.scadenza > Date.now()) { stato.fase = "running"; stato.scadenza = dati.scadenza; }
        else { stato.fase = "done"; stato.rimasti = 0; }
      } else if (dati.fase === "paused" && Number.isFinite(dati.rimasti) && dati.rimasti > 0) {
        stato.fase = "paused"; stato.rimasti = dati.rimasti; stato.durata = Number(dati.durata) || dati.rimasti;
      }
    }

    /* ---------- calcoli ---------- */
    const formatoCorrente = () => FORMATI.find(f => f.id === stato.formato) || null;
    function secondiPrevisti() {
      const f = formatoCorrente();
      if (!f) return 0;
      return Math.min(MAX_SEC, Math.max(MIN_SEC, f.sec + SCARTI[stato.cottura] + stato.manuale));
    }
    function msRimasti() {
      if (stato.fase === "running") return Math.max(0, stato.scadenza - Date.now());
      if (stato.fase === "paused") return stato.rimasti;
      if (stato.fase === "done") return 0;
      return secondiPrevisti() * 1000;
    }
    function mmss(ms) {
      const tot = Math.ceil(ms / 1000);
      return String(Math.floor(tot / 60)).padStart(2, "0") + ":" + String(tot % 60).padStart(2, "0");
    }
    function numero(n, dec) {
      return n.toLocaleString("it-IT", { minimumFractionDigits: dec, maximumFractionDigits: dec });
    }

    /* ---------- disegno ---------- */
    function disegna() {
      const f = formatoCorrente();
      const ms = msRimasti();
      app.dataset.fase = stato.fase;

      nomeFormato.textContent = f ? f.nome : "Scegli il formato";
      tempoEl.textContent = f ? mmss(ms) : "🍝";
      tempoEl.classList.toggle("glifo", !f);

      const testiStato = { idle: ETICHETTE[stato.cottura], running: "in cottura", paused: "in pausa", done: "è pronta!" };
      statoEl.textContent = f ? testiStato[stato.fase] : "tocca qui";

      if (!f) sottotitolo.textContent = "Tocca per scegliere tra " + FORMATI.length + " formati";
      else if (stato.fase === "idle") sottotitolo.textContent = "Tempo previsto " + mmss(secondiPrevisti() * 1000) + " · " + ETICHETTE[stato.cottura];
      else if (stato.fase === "done") sottotitolo.textContent = "Scola subito e condisci";
      else sottotitolo.textContent = "Su " + mmss(stato.durata) + " totali · " + ETICHETTE[stato.cottura];

      const totale = stato.fase === "idle" || !stato.durata ? secondiPrevisti() * 1000 : stato.durata;
      const quota = stato.fase === "done" ? 1 : totale > 0 ? Math.min(1, Math.max(0, ms / totale)) : 0;
      arco.setAttribute("stroke-dasharray", CIRCONFERENZA.toFixed(1));
      arco.setAttribute("stroke-dashoffset", (CIRCONFERENZA * (1 - (f ? quota : 0))).toFixed(1));

      btnAvvia.textContent = !f ? "Scegli il formato"
        : stato.fase === "running" ? "Pausa"
        : stato.fase === "paused" ? "Riprendi"
        : stato.fase === "done" ? "Di nuovo" : "Avvia";
      btnAzzera.disabled = !f || stato.fase === "idle";
      el("piu").disabled = el("meno").disabled = !f || stato.fase === "done";
      ring.setAttribute("aria-label", f
        ? f.nome + ", " + mmss(ms) + ", " + (stato.fase === "running" ? "tocca per mettere in pausa" : "tocca per avviare")
        : "Nessun formato scelto");

      const grammi = stato.persone * 100;
      numPersone.textContent = stato.persone + (stato.persone === 1 ? " pers." : " pers.");
      el("menoPersone").disabled = stato.persone <= 1;
      el("piuPersone").disabled = stato.persone >= 12;
      calcolo.innerHTML = "<b>" + grammi + " g</b> pasta · <b>" + numero(grammi / 100, 1) +
        " L</b> acqua · <b>" + Math.round(grammi / 10) + " g</b> sale";

      document.title = stato.fase === "running" ? mmss(ms) + " · " + titoloBase : titoloBase;
    }

    /* ---------- ciclo del timer ---------- */
    function avviaTick() {
      fermaTick();
      tick = setInterval(() => {
        if (stato.fase !== "running") return fermaTick();
        if (msRimasti() <= 0) finisci();
        else disegna();
      }, 250);
    }
    function fermaTick() { if (tick) { clearInterval(tick); tick = null; } }

    function avvia() {
      const f = formatoCorrente();
      if (!f) return apriPannello();
      preparaAudio();
      if (stato.fase === "running") return pausa();
      if (stato.fase === "paused") {
        stato.scadenza = Date.now() + stato.rimasti;
      } else {
        stato.durata = secondiPrevisti() * 1000;
        stato.scadenza = Date.now() + stato.durata;
        fermaSveglia();
      }
      stato.fase = "running";
      avviaTick();
      tieniAccesoSchermo();
      annuncia(f.nome + ": timer avviato, " + mmss(msRimasti()));
      salva(); disegna();
    }
    function pausa() {
      stato.rimasti = msRimasti();
      stato.fase = "paused";
      fermaTick(); rilasciaSchermo();
      annuncia("Timer in pausa a " + mmss(stato.rimasti));
      salva(); disegna();
    }
    function azzera() {
      fermaTick(); fermaSveglia(); rilasciaSchermo();
      stato.fase = "idle"; stato.rimasti = 0; stato.scadenza = 0; stato.durata = 0; stato.manuale = 0;
      annuncia("Timer azzerato");
      salva(); disegna();
    }
    function finisci() {
      fermaTick(); rilasciaSchermo();
      stato.fase = "done"; stato.rimasti = 0; stato.scadenza = 0;
      salva(); disegna();
      suona(); vibra();
      annuncia("La pasta è pronta");
    }

    /* ---------- suono, vibrazione, schermo ---------- */
    function preparaAudio() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audio) audio = new Ctx();
        if (audio.state === "suspended") audio.resume();
      } catch (e) { audio = null; }
    }
    function bip(quando, frequenza) {
      if (!audio) return;
      const osc = audio.createOscillator(), vol = audio.createGain();
      osc.type = "sine"; osc.frequency.value = frequenza;
      vol.gain.setValueAtTime(0.0001, quando);
      vol.gain.exponentialRampToValueAtTime(0.28, quando + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, quando + 0.32);
      osc.connect(vol); vol.connect(audio.destination);
      osc.start(quando); osc.stop(quando + 0.36);
    }
    function serie() {
      if (!audio || audio.state !== "running") return;
      const t = audio.currentTime;
      bip(t, 880); bip(t + 0.42, 880); bip(t + 0.84, 1174);
    }
    function suona() {
      if (!audio) return;
      serie();
      let ripetizioni = 0;
      fermaSveglia();
      sveglia = setInterval(() => {
        if (stato.fase !== "done" || ++ripetizioni > 12) return fermaSveglia();
        serie(); vibra();
      }, 3000);
    }
    function fermaSveglia() { if (sveglia) { clearInterval(sveglia); sveglia = null; } }
    function vibra() { try { if (navigator.vibrate) navigator.vibrate([160, 90, 160]); } catch (e) { /* non supportato */ } }

    async function tieniAccesoSchermo() {
      try {
        if (!("wakeLock" in navigator) || schermo) return;
        schermo = await navigator.wakeLock.request("screen");
        schermo.addEventListener("release", () => { schermo = null; });
      } catch (e) { schermo = null; }
    }
    function rilasciaSchermo() { try { if (schermo) { schermo.release(); schermo = null; } } catch (e) { schermo = null; } }

    function annuncia(testo) { annuncio.textContent = testo; }

    /* ---------- pannello formati ---------- */
    let ultimoFuoco = null;
    function creaElenco(filtro) {
      const q = (filtro || "").trim().toLowerCase();
      const visibili = FORMATI.filter(f => !q || f.nome.toLowerCase().includes(q));
      elenco.innerHTML = "";
      for (const f of visibili) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button"; b.className = "voce"; b.dataset.id = f.id;
        if (f.id === stato.formato) b.setAttribute("aria-current", "true");
        const nome = document.createElement("span");
        nome.textContent = f.nome;
        const min = document.createElement("span");
        min.className = "min";
        min.textContent = (f.sec % 60 === 0 ? f.sec / 60 + " min" : mmss(f.sec * 1000).replace(/^0/, ""));
        b.append(nome, min);
        li.append(b); elenco.append(li);
      }
      nessuno.hidden = visibili.length > 0;
    }
    function apriPannello() {
      ultimoFuoco = document.activeElement;
      creaElenco(cerca.value);
      document.body.classList.add("aperto");
      pannello.setAttribute("aria-hidden", "false");
      const attuale = elenco.querySelector('[aria-current="true"]');
      setTimeout(() => { (attuale || elenco.querySelector(".voce") || cerca).focus({ preventScroll: true }); attuale && attuale.scrollIntoView({ block: "center" }); }, 60);
    }
    function chiudiPannello() {
      document.body.classList.remove("aperto");
      pannello.setAttribute("aria-hidden", "true");
      if (ultimoFuoco && document.contains(ultimoFuoco)) ultimoFuoco.focus({ preventScroll: true });
    }
    const pannelloAperto = () => document.body.classList.contains("aperto");

    function scegliFormato(id) {
      const f = FORMATI.find(x => x.id === id);
      if (!f) return;
      fermaTick(); fermaSveglia(); rilasciaSchermo();
      stato.formato = id; stato.manuale = 0; stato.fase = "idle";
      stato.rimasti = 0; stato.scadenza = 0; stato.durata = 0;
      salva(); disegna(); chiudiPannello();
      annuncia(f.nome + ", tempo previsto " + mmss(secondiPrevisti() * 1000));
    }

    /* ---------- eventi ---------- */
    btnFormato.addEventListener("click", apriPannello);
    el("btnChiudi").addEventListener("click", chiudiPannello);
    velo.addEventListener("click", chiudiPannello);
    cerca.addEventListener("input", () => creaElenco(cerca.value));
    cerca.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const primo = elenco.querySelector(".voce");
        if (primo) { e.preventDefault(); scegliFormato(primo.dataset.id); }
      }
    });
    elenco.addEventListener("click", (e) => {
      const b = e.target.closest(".voce");
      if (b) scegliFormato(b.dataset.id);
    });
    // Il fuoco resta dentro al pannello finché è aperto.
    pannello.addEventListener("keydown", (e) => {
      if (e.key !== "Tab") return;
      const fuocabili = pannello.querySelectorAll("button, input");
      if (!fuocabili.length) return;
      const primo = fuocabili[0], ultimo = fuocabili[fuocabili.length - 1];
      if (e.shiftKey && document.activeElement === primo) { e.preventDefault(); ultimo.focus(); }
      else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primo.focus(); }
    });

    for (const chip of document.querySelectorAll(".chip")) {
      chip.addEventListener("click", () => {
        stato.cottura = chip.dataset.cottura;
        for (const c of document.querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c === chip));
        if (stato.fase !== "idle") azzera(); else { salva(); disegna(); }
      });
    }

    btnAvvia.addEventListener("click", avvia);
    ring.addEventListener("click", () => { if (stato.fase === "done") azzera(); else avvia(); });
    btnAzzera.addEventListener("click", azzera);

    function regolaTempo(delta) {
      if (!formatoCorrente()) return;
      if (stato.fase === "idle") {
        const prima = secondiPrevisti();
        stato.manuale += delta;
        if (secondiPrevisti() === prima) stato.manuale -= delta; // fuori dai limiti: annulla
      } else if (stato.fase === "running") {
        stato.scadenza = Math.max(Date.now() + 1000, stato.scadenza + delta * 1000);
        stato.durata = Math.max(1000, stato.durata + delta * 1000);
      } else if (stato.fase === "paused") {
        stato.rimasti = Math.max(1000, stato.rimasti + delta * 1000);
        stato.durata = Math.max(stato.durata, stato.rimasti);
      } else return;
      salva(); disegna();
    }
    el("piu").addEventListener("click", () => regolaTempo(30));
    el("meno").addEventListener("click", () => regolaTempo(-30));

    function regolaPersone(delta) {
      stato.persone = Math.min(12, Math.max(1, stato.persone + delta));
      salva(); disegna();
    }
    el("piuPersone").addEventListener("click", () => regolaPersone(1));
    el("menoPersone").addEventListener("click", () => regolaPersone(-1));

    document.addEventListener("keydown", (e) => {
      const scrive = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
      if (e.key === "Escape") {
        if (pannelloAperto()) { e.preventDefault(); chiudiPannello(); }
        else if (stato.fase === "done" || stato.fase === "paused") { e.preventDefault(); azzera(); }
        return;
      }
      if (pannelloAperto() || scrive) return;
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        if (stato.fase === "done") azzera(); else avvia();
      }
    });

    // Tornando sull'app dopo un po' in secondo piano: riallinea o concludi il conto alla rovescia.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (stato.fase === "running") {
        if (msRimasti() <= 0) finisci();
        else { avviaTick(); tieniAccesoSchermo(); disegna(); }
      }
    });
    window.addEventListener("pagehide", () => { fermaTick(); fermaSveglia(); });

    /* ---------- avvio ---------- */
    carica();
    for (const c of document.querySelectorAll(".chip")) c.setAttribute("aria-pressed", String(c.dataset.cottura === stato.cottura));
    creaElenco("");
    disegna();
    if (stato.fase === "running") { if (msRimasti() <= 0) finisci(); else avviaTick(); }
  </script>
</body>
</html>
