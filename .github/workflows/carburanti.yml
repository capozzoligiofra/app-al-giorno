# Ogni mattina scarica gli open data MIMIT e aggiorna data/carburanti.json (medie regionali e provinciali).
# Gratis sui repository pubblici. Manuale: Actions → "Prezzi carburanti" → Run workflow.
name: Prezzi carburanti
on:
  schedule:
    - cron: "40 6 * * *"   # 06:40 UTC = 08:40 ora italiana (i dati MIMIT delle 8 sono pronti)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: carburanti
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scarica e calcola le medie
        run: node tools/carburanti.mjs
      - name: Commit se cambiato
        run: |
          git config user.name "carburanti-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/carburanti.json
          if git diff --cached --quiet; then echo "invariato"; exit 0; fi
          git commit -m "dati: prezzi carburanti MIMIT $(node -e "console.log(require('./data/carburanti.json').updated)")"
          git pull --rebase origin main
          git push origin main
